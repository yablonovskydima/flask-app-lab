{% extends "base.html" %}
{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">Confirm Delete</h2>

  <div class="alert alert-warning">
    Are you sure you want to delete the post titled "<strong>{{ post.title }}</strong>"?
  </div>

  <form method="POST" action="{{ url_for('posts.delete_post', id=post.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{{ url_for('posts.show_post', id=post.id) }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
