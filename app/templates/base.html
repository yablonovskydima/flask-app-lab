<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Lab 3</h1>
        <nav>
            <a href="/">Home</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <form method="post">
            <label for="username">Enter username:</label>
            <input type="text" id="username" name="username">
            <button type="submit">Go to User</button>
        </form>

        <br><br>

        <form method="post">
            <label for="product">Enter product name:</label>
            <input type="text" id="product" name="product">
            <button type="submit">Go to Product</button>
        </form>
        {% endblock %}
    </main>
</body>
</html>
