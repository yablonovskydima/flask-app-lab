<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 5</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body  class="{{ theme }}">
    <header>
        <h1>Lab 5</h1>
        <nav>
            <a href="/">Home</a>
            <a href="{{ url_for('contact.contact') }}">Contact Me</a>
        </nav>
    </header>

    <main id="main-page">
        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        {% block content %}
        <nav>
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.profile') }}">Profile</a>
            <a href="{{ url_for('posts.list_posts') }}">Blog</a>
        </nav>

        <form method="post">
            <label for="username">Enter username:</label>
            <input type="text" id="username" name="username" required>

            <label for="age">Enter age:</label>
            <input type="number" id="age" name="age" min="1">

            <label for="role">Enter role:</label>
            <select id="role" name="role">
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>

            <button type="submit">Go to User</button>
        </form>

        <form method="post">
            <label for="product">Enter product name:</label>
            <input type="text" id="product" name="product" required>

            <label for="price">Enter product price:</label>
            <input type="number" id="price" name="price" min="0" step="0.01">

            <button type="submit">Go to Product</button>
        </form>
        {% endblock %}
    </main>
</body>
</html>
