{% extends "base.html" %}
{% block content %}

<h2>Create Institution Type</h2>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a href="{{ url_for('institutions.list_institutions') }}" class="btn btn-warning mb-3">Back</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<form method="POST">
    {{ form.hidden_tag() }}

    <div class="form-group">
        {{ form.type_name.label }}<br>
        {{ form.type_name(class="form-control") }}
    </div>

    <div class="form-group">
        {{ form.description.label }}<br>
        {{ form.description(class="form-control", rows="4") }}
    </div>

    <br>
    <button class="btn btn-primary" type="submit">
        {{ form.submit.label.text }}
    </button>
</form>

{% endblock %}
