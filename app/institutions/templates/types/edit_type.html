{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Institution Type</h2>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="{{ url_for('institutions.list_institutions') }}" class="btn btn-warning mb-3">Back</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            <label class="form-label">Type Name</label>
            <input type="text" name="type_name" value="{{ type.type_name }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control">{{ type.description or '' }}</textarea>
        </div>
        <button class="btn btn-success">Save Changes</button>
    </form>
</div>
{% endblock %}
