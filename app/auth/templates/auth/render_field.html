{% macro render_field(field) %}
<div class="form-group">
    {{ field.label }}<br>
    {{ field(class="form-control") }}
    {% if field.errors %}
        <ul class="errors">
        {% for error in field.errors %}
            <li style="color: red;">{{ error }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</div>
{% endmacro %}
