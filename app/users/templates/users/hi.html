{% extends "base.html" %}

{% block title %}User Page{% endblock %}

{% block content %}
<div style="display: flex;">
    <nav style="width: 200px; margin-right: 20px; border-right: 1px solid #ccc; padding-right: 10px;">
        <ul style="list-style: none; padding: 0;">
            <li><a href="{{ url_for('users.user_page') }}">User Page</a></li>
            <li><a href="{{ url_for('users.admin_page') }}">Admin Page</a></li>
        </ul>
    </nav>

    <div>
        <h2>Hello, {{ name }}!</h2>
        <p>Age: {{ age }}</p>
        <p>Role: {{ role }}</p>
    </div>
</div>
{% endblock %}
