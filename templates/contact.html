{% extends 'base.html' %}
{% block content %}
<section id="contact" class="mb-5">
  <h2>Contact Me</h2>
  <p class="text-muted mb-4">Feel free to reach out!</p>

  <form id="contactForm" class="contact-form">
    <div class="mb-3">
      <label for="email" class="form-label">Your Email</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
    </div>

    <div class="mb-3">
      <label for="subject" class="form-label">Subject</label>
      <input type="text" id="subject" name="subject" class="form-control" placeholder="Message subject" required>
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea id="message" name="message" rows="5" class="form-control" placeholder="Type your message..." required></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">Send Message</button>
  </form>
</section>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const email = encodeURIComponent(document.getElementById('email').value);
    const subject = encodeURIComponent(document.getElementById('subject').value);
    const message = encodeURIComponent(document.getElementById('message').value);

    const recipient = "dmytro.yablonovskyi.23@pnu.edu.ua";
    const mailtoLink = `mailto:${recipient}?subject=${subject}&body=From:%20${email}%0A%0A${message}`;

    window.location.href = mailtoLink;
  });
</script>
{% endblock %}
